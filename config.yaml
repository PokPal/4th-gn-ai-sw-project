# 바이브컷 설정 — 조정 가능한 수치는 모두 여기에 둔다 (CLAUDE.md 4장 5번)
# 아래 값은 초기 기본값이며, 테스트 영상으로 확인하면서 조정한다.

paths:
  cache_dir: data/cache
  memory_file: memory/preferences.json
  log_dir: logs

video_id:
  hash_head_bytes: 8388608     # 해시에 사용할 파일 앞부분 크기 (8MB)

media:
  audio_sample_rate: 16000     # 음성 추출 샘플레이트 (음성 인식·음량 분석용)
  analysis_height: 360         # 화면 분석용 저해상도 사본 높이(px)

stt:
  provider: openai-whisper
  model: whisper-1
  language: ko
  chunk_seconds: 600           # 25MB 제한 때문에 음성을 나눠 보낼 길이(초)
  drop_no_speech_prob: 0.8     # 말소리가 없을 확률이 이보다 높은 문장은 버림 (배경음 환각 방지)

detectors:
  silence:
    noise_db: -40.0            # 이 값보다 작으면 무음
    min_duration: 2.0          # 최소 무음 길이(초)
  loudness:
    window_seconds: 0.5        # 음량 계산 창 크기
    baseline_seconds: 30.0     # 평균 음량 비교 구간 길이
    threshold_db: 8.0          # 기준 음량보다 이만큼 크면 급증
    active_db: -40.0           # 이보다 큰 창만 "소리가 나는 구간"으로 봄
    floor_percentile: 50       # 기준 음량의 바닥 = 소리가 나는 구간 음량의 이 백분위 (평소 말하는 크기)
    min_duration: 0.5
    merge_gap: 1.0             # 이 간격보다 가까운 급증은 하나로 합침
  reaction:
    # 단어가 키워드와 같거나, 키워드 뒤에 늘어진 소리(아아, ~, !, ㅋㅋ 등)만 붙은 경우 반응으로 본다
    keywords: [와, 우와, 헐, 대박, 미쳤다, 미쳤어, 미친, 뭐야, 오, 으악, 아악, 잡았다, 됐다, 살았다, 개쩐다, 레전드, 나이스, 제발]
    context_seconds: 2.0       # 반응 단어 앞뒤로 포함할 시간
    base_score: 0.6            # 반응 단어 1개일 때 점수
    extra_score: 0.2           # 같은 구간에 반응 단어가 하나 늘 때마다 더할 점수
  visual:
    scene_threshold: 27.0      # PySceneDetect ContentDetector 민감도 (낮을수록 민감)
    sample_fps: 2.0            # 밝기·프레임 변화량 계산 시 초당 샘플 수
    brightness_jump: 40.0      # 밝기(0~255) 급변 기준
    motion_threshold: 0.25     # 프레임 변화량(0~1) 급변 기준
    merge_gap: 1.0             # 이 간격보다 가까운 화면 급변은 하나로 합침
    point_window: 0.5          # 장면 전환·밝기 급변 같은 순간 이벤트를 앞뒤로 넓힐 시간
    # 채도 급감(흑백 전환) — 예: 리그 오브 레전드 사망 화면
    game_region: [0.0, 0.0, 0.72, 0.85]   # 색을 잴 게임 화면 영역 (x0, y0, x1, y1 화면 비율). 방송 오버레이(캐릭터·채팅)를 빼도록 영상 구성에 맞게 조정
    color_saturation: 80       # 채도(0~255)가 이 값 이상인 픽셀을 "색 있는 픽셀"로 봄
    desaturation_ratio: 0.25   # 영역 안 색 있는 픽셀 비율이 이보다 낮으면 흑백 화면 (생존 화면 0.35 이상, 사망 화면 0.15 이하에서 정함)
    desaturation_min_duration: 4.0   # 흑백이 이 시간(초) 이상 이어져야 이벤트
    desaturation_min_brightness: 25  # 이보다 어두운 화면(검은 전환 화면)은 제외
    desaturation_max_brightness: 120 # 이보다 밝은 화면(파스텔 톤 대기 화면 등)은 제외. 사망 화면 밝기는 35~55
    desaturation_lookback: 10.0      # 흑백 전환 직전 이 시간(초) 동안의 색 비율을 봄
    desaturation_before_min: 0.35    # 직전 색 비율이 이 값 이상이어야 "갑자기 흑백으로 바뀐 것"으로 인정 (대기 화면·어두운 맵 제외)
  dead_time:
    min_duration: 15.0         # 이 길이 이상 조용하고 화면 변화가 적으면 지루한 구간
    max_motion: 0.03           # 이 값보다 화면 변화가 작으면 정적인 화면
    active_db: -40.0           # 이보다 큰 창만 "소리가 나는 구간"으로 봄
    quiet_percentile: 50       # 소리가 나는 구간 음량의 이 백분위 이하이면 조용한 것으로 봄
    smooth_seconds: 5.0        # 순간 변화에 끊기지 않게 이 길이로 중앙값을 냄
    merge_gap: 3.0             # 이 간격 이하로 끊긴 지루한 구간은 하나로 합침

scoring:
  weights:                     # 하이라이트 점수 가중치
    loudness_spike: 0.30
    reaction: 0.35
    scene_change: 0.10
    brightness_change: 0.10
    motion: 0.15
    desaturation: 0.40           # 화면 흑백 전환(사망 추정)
  merge_gap: 3.0               # 신호를 하나의 후보로 묶는 최대 간격(초)
  padding_before: 3.0          # 후보 앞에 붙일 여유 시간
  padding_after: 2.0           # 후보 뒤에 붙일 여유 시간
  min_score: 0.2               # 이 점수 미만은 후보에서 제외
  anchor_windows:              # 이벤트 시작 시점을 기준으로 후보 구간을 잡는 종류 (흑백 화면 자체는 부활 대기라 지루함)
    desaturation: {before: 15.0, after: 3.0}   # 죽기 15초 전 교전부터 죽은 직후 3초까지
  max_duration: 45.0           # 후보 최대 길이(초). 신호가 이어 붙어 더 길어지면 가장 큰 틈에서 나눔

agent:
  model: claude-opus-5-5       # 비용을 줄이려면 claude-sonnet-5-5
  effort: high                 # low | medium | high (판단 깊이와 토큰 사용량)
  max_tokens: 16000
  max_turns: 30                # 에이전트 루프 최대 반복 횟수 (비용 상한 역할)
  candidate_limit: 30          # list_candidates 한 번에 돌려줄 최대 개수
  transcript_max_chars: 6000   # get_transcript 한 번에 돌려줄 최대 글자 수 (비용 상한)
  price_per_mtok:              # 비용 기록용 단가 (USD / 100만 토큰) — 모델을 바꾸면 함께 바꿀 것
    input: 4.0
    output: 20.0
    cache_write: 5.0
    cache_read: 0.2
  max_questions: 3             # 한 번에 묻는 최대 질문 수
  duration_tolerance: 0.05     # 목표 길이 허용 오차 비율 (±5%)

edit:
  # build_edit가 클립 경계를 말소리에 맞춰 자동 보정한다
  snap_to_speech: true
  speech_pre_roll: 1.0         # 말 시작 전에 남길 시간(초)
  speech_post_roll: 0.5        # 말 끝난 뒤에 남길 시간(초)
  merge_gap: 2.0               # 이어지는 두 클립 사이 간격이 이 값(초) 이하면 자르지 않고 하나로 합침

export:
  default_fps: 30.0            # meta.json에 fps가 없을 때만 사용
  default_marker_color: Blue
  timeline_start: 3600.0       # 타임라인 시작 타임코드(초) — 다빈치 리졸브 기본값 01:00:00:00
