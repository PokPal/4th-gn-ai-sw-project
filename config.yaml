# 바이브컷 설정 — 조정 가능한 수치는 모두 여기에 둔다 (CLAUDE.md 4장 5번)
# 아래 값은 초기 기본값이며, 테스트 영상으로 확인하면서 조정한다.

paths:
  cache_dir: data/cache
  memory_file: memory/preferences.json
  log_dir: logs

video_id:
  hash_head_bytes: 8388608     # 해시에 사용할 파일 앞부분 크기 (8MB)

media:
  audio_sample_rate: 16000     # 음성 추출 샘플레이트 (음성 인식·음량 분석용)
  analysis_height: 360         # 화면 분석용 저해상도 사본 높이(px)

stt:
  provider: openai-whisper
  model: whisper-1
  language: ko
  chunk_seconds: 600           # 25MB 제한 때문에 음성을 나눠 보낼 길이(초)
  drop_no_speech_prob: 0.8     # 말소리가 없을 확률이 이보다 높은 문장은 버림 (배경음 환각 방지)

detectors:
  silence:
    noise_db: -40.0            # 이 값보다 작으면 무음
    min_duration: 2.0          # 최소 무음 길이(초)
  loudness:
    window_seconds: 0.5        # 음량 계산 창 크기
    baseline_seconds: 30.0     # 평균 음량 비교 구간 길이
    threshold_db: 8.0          # 평균보다 이만큼 크면 급증
    min_duration: 0.5
    merge_gap: 1.0             # 이 간격보다 가까운 급증은 하나로 합침
  reaction:
    keywords: [와, 헐, 대박, 미쳤다, 미친, 뭐야, 아니, 오, 으악, 잡았다, 됐다, 살았다, 개쩐다, 레전드]
    context_seconds: 2.0       # 반응 단어 앞뒤로 포함할 시간
  visual:
    scene_threshold: 27.0      # PySceneDetect ContentDetector 민감도 (낮을수록 민감)
    sample_fps: 2.0            # 밝기·프레임 변화량 계산 시 초당 샘플 수
    brightness_jump: 40.0      # 밝기(0~255) 급변 기준
    motion_threshold: 0.25     # 프레임 변화량(0~1) 급변 기준
  dead_time:
    min_duration: 15.0         # 이 길이 이상 조용하고 화면 변화가 적으면 지루한 구간
    max_motion: 0.03           # 이 값보다 화면 변화가 작으면 정적인 화면

scoring:
  weights:                     # 하이라이트 점수 가중치
    loudness_spike: 0.30
    reaction: 0.35
    scene_change: 0.10
    brightness_change: 0.10
    motion: 0.15
  merge_gap: 3.0               # 신호를 하나의 후보로 묶는 최대 간격(초)
  padding_before: 3.0          # 후보 앞에 붙일 여유 시간
  padding_after: 2.0           # 후보 뒤에 붙일 여유 시간
  min_score: 0.2               # 이 점수 미만은 후보에서 제외

agent:
  model: claude-sonnet-5-5
  max_tokens: 4096
  max_turns: 30                # 에이전트 루프 최대 반복 횟수
  max_questions: 3             # 한 번에 묻는 최대 질문 수
  duration_tolerance: 0.05     # 목표 길이 허용 오차 비율 (±5%)

export:
  default_fps: 30.0            # meta.json에 fps가 없을 때만 사용
  default_marker_color: Blue
